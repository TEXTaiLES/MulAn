[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mulan-app"
version = "1.0.0"
description = "Multispectral viewer and semantic annotator"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=22,<24",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "python-dotenv>=1,<2",
  "rasterio>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
mulan = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend"]
