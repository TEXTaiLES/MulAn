services:
  mulan:
    build: .
    ports:
      - "${MULAN_PORT:-5001}:${MULAN_PORT:-5001}"
    environment:
      MULAN_PORT: ${MULAN_PORT:-5001}
      MULAN_DATA_DIR: /data
      MULAN_RESOURCE_TTL_HOURS: ${MULAN_RESOURCE_TTL_HOURS:-24}
      MULAN_MAX_UPLOAD_MB: ${MULAN_MAX_UPLOAD_MB:-512}
      HESTIA_API_URL: ${HESTIA_API_URL:-http://host.docker.internal:5000}
      HESTIA_PORTAL_URL: ${HESTIA_PORTAL_URL:-http://localhost:8055}
      HESTIA_COOKIE_NAME: ${HESTIA_COOKIE_NAME:-textailes_refresh_token}
      HESTIA_TIMEOUT_SECONDS: ${HESTIA_TIMEOUT_SECONDS:-30}
      MULAN_PUBLIC_URL: ${MULAN_PUBLIC_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mulan-data:/data
    restart: unless-stopped

volumes:
  mulan-data:
